[project]
name = "contract-analyzer-enterprise"
version = "0.0.0"
description = "Revisão rastreável de contratos B2B com decisões humanas."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = []

[project.scripts]
contract-analyzer = "contract_analyzer_enterprise.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.16.2", "taskipy>=1.14.1"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["I", "F", "E", "W", "PL"]

[tool.ruff.format]
quote-style = "single"

[tool.taskipy.tasks]
lint = "ruff check ."
format = "ruff format ."
