name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.7"
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv build
      - run: |
          uv venv .smoke
          uv pip install --python .smoke/bin/python dist/*.whl
          .smoke/bin/python -m contract_analyzer_enterprise --version
          .smoke/bin/contract-analyzer --help
