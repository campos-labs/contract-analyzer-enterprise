name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Instalar Python definido em .python-version
        run: uv python install

      - name: Instalar dependências e verificar lock
        run: uv sync --locked --dev

      - name: Verificar formatação
        run: uv run --no-sync ruff format --check .

      - name: Executar lint e testes com cobertura
        run: uv run --no-sync task test

      - name: Construir distribuições Python
        run: uv build --no-sources

      - name: Instalar e importar wheel fora do checkout
        run: |
          uv venv "$RUNNER_TEMP/wheel-smoke"
          uv pip install --python "$RUNNER_TEMP/wheel-smoke/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH APP_LOG_LEVEL=INVALID \
            "$RUNNER_TEMP/wheel-smoke/bin/python" -I -c \
            'from contract_analyzer_enterprise.app import app; print(app.title)'

  docker:
    name: Docker e health check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar configuração de exemplo
        run: cp .env.example .env

      - name: Validar Compose
        run: docker compose config -q

      - name: Construir imagem e iniciar aplicação
        run: docker compose up --build --detach

      - name: Verificar resposta de GET /healthz
        run: |
          healthz_status=$(curl --fail --silent --show-error \
            --retry 15 --retry-all-errors --retry-delay 2 --max-time 5 \
            --write-out '%{http_code}' --output /tmp/healthz.json \
            http://127.0.0.1:8000/healthz)
          test "$healthz_status" = '200'
          python3 -c 'import json; from pathlib import Path; assert json.loads(Path("/tmp/healthz.json").read_text()) == {"status": "ok"}'

      - name: Mostrar logs
        if: always()
        run: docker compose logs --no-color

      - name: Encerrar aplicação
        if: always()
        run: docker compose down --volumes --remove-orphans
